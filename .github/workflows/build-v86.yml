name: Build V86 redesigned WJO homepage
on:
  push:
    paths:
      - 'source/v86/**'
      - 'tools/rebuild_v86.py'
      - '.github/workflows/build-v86.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: wjo-v86-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install builder dependencies
        run: python -m pip install pillow
      - name: Validate homepage JavaScript and responsive styling
        run: |
          node --check source/v86/home.js
          python -m py_compile tools/rebuild_v86.py
          node <<'JS'
          const fs=require('fs'),vm=require('vm'),assert=require('assert');
          const src=fs.readFileSync('source/v86/home.js','utf8');
          const css=fs.readFileSync('source/v86/home.css','utf8');
          const context={
            window:{WJO_V81_FAMILY_PHOTOS:{group:'data:image/webp;base64,AAA',pupils:'data:image/webp;base64,BBB',awards:'data:image/webp;base64,CCC',certificates:'data:image/webp;base64,DDD'}},
            routes:{home:()=>'<div>OLD HOMEPAGE</div>'},
            shell:html=>html,
            resolveAssetPath:p=>'local:'+p
          };
          vm.runInNewContext(src,context);
          const home=context.routes.home();
          assert(home.includes('class="w86-home"'));
          assert(!home.includes('OLD HOMEPAGE'));
          assert.strictEqual((home.match(/<h1\b/g)||[]).length,1);
          assert.strictEqual((home.match(/class="w86-programme"/g)||[]).length,3);
          assert.strictEqual((home.match(/class="w86-step"/g)||[]).length,3);
          for(const link of ['#start','#first-visit','#super-js','#confident-kidz','#adults','#stories','#grade-order','#instructors','#student-code','#safeguarding']){
            assert(home.includes('href="'+link+'"'),link);
          }
          for(const name of ['w86-hero-photo','w86-family-picture','w86-belt-line','w86-closing'])assert(home.includes(name));
          for(const bp of ['@media(max-width:760px)','@media(max-width:440px)','prefers-reduced-motion'])assert(css.includes(bp));
          assert(css.includes('.w86-home h1:focus'),"Heading focus outline fix");
          assert(!/<h1[^>]*style=/.test(home));
          console.log("Homepage content and mobile rules verified");
          JS
      - name: Build V86 single-file demo and ZIP
        run: python tools/rebuild_v86.py
      - name: Verify homepage and preserved website features
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          html=Path('WJO_V86_SINGLE_FILE_DEMO.html').read_text(encoding='utf-8')
          expected=[
            'wjo-v86-home-css','w86-hero-layout','w86-family-layout','w86-programme-grid',
            'w86-progression-layout','w86-steps','w86-closing-layout',
            'WJO_V81_FAMILY_PHOTOS','WJO_FULL_NEWS_ARCHIVE','WJO_V84_GRADES',
            'WJO_V85_CHART_IMAGES',"routes['committee-hub']", "routes['brown-second-tag']",
          ]
          for value in expected:assert value in html,value
          assert html.count("window.addEventListener('hashchange',render);render()")==1
          assert Path('WJO_V86_SINGLE_FILE_DEMO.html').stat().st_size>250000
          with ZipFile('WJO_V86_DOWNLOAD.zip') as z:
              names=z.namelist()
              assert 'WJO_V86_SINGLE_FILE_DEMO.html' in names
              assert len([x for x in names if 'Brown_2nd_Tag' in x])==2
          print("V86 successfully verified",len(html),"characters")
          PY
      - name: Commit downloadable V86 website
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f WJO_V86_SINGLE_FILE_DEMO.html WJO_V86_DOWNLOAD.zip dist/index.html
          git diff --cached --quiet || (git commit -m "Publish V86 redesigned family-first WJO website" && git push)
