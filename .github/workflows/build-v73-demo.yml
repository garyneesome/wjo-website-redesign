name: Build WJO V73 downloadable demo
on:
  push:
    paths:
      - 'source/v73/**'
      - 'tools/rebuild_v73.py'
      - 'tools/test_v73.cjs'
      - '.github/workflows/build-v73-demo.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: wjo-v73-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build portable HTML, static web output and ZIP
        run: python3 tools/rebuild_v73.py
      - name: Check JavaScript parses
        run: node --check source/v73/experience.js
      - name: Verify output identity and complete bundle
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          h=Path('WJO_V73_SINGLE_FILE_DEMO.html')
          z=Path('WJO_V73_DOWNLOAD.zip')
          web=Path('dist/index.html')
          assert h.is_file() and h.stat().st_size>1_000_000
          assert z.is_file() and z.stat().st_size>1_000_000
          assert web.is_file() and web.stat().st_size>100_000
          t=web.read_text()
          for needle in ('v73-mobile-bar', 'routes[\'new-to-jado\']', 'j73Fit', 'WJO', 'V73'):
              assert needle in t,needle
          with zipfile.ZipFile(z) as zz:
              assert zz.testzip() is None
              assert 'WJO_V73_SINGLE_FILE_DEMO.html' in zz.namelist()
          PY
      - name: Install browser DOM test dependency
        run: npm install --no-save --ignore-scripts jsdom@30.1.2
      - name: Test interactive mobile navigation and guided pages
        run: node tools/test_v73.cjs dist/index.html
      - name: Upload release downloads as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WJO-V73-downloads
          path: |
            WJO_V73_SINGLE_FILE_DEMO.html
            WJO_V73_DOWNLOAD.zip
          retention-days: 30
      - name: Commit portable downloads
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f WJO_V73_SINGLE_FILE_DEMO.html WJO_V73_DOWNLOAD.zip
          if ! git diff --cached --quiet; then
            git commit -m 'Build WJO V73 single-file demo and ZIP'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
