name: Build V81 single-file demo
on:
  push:
    paths:
      - 'source/v81/**'
      - 'tools/rebuild_v81.py'
      - '.github/workflows/build-v81.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pillow
      - name: Build complete V81
        run: python tools/rebuild_v81.py
      - name: Check output
        run: |
          test -s WJO_V81_SINGLE_FILE_DEMO.html
          test -s WJO_V81_DOWNLOAD.zip
          grep -q 'v81-home' WJO_V81_SINGLE_FILE_DEMO.html
      - name: Commit generated single file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f WJO_V81_SINGLE_FILE_DEMO.html WJO_V81_DOWNLOAD.zip dist/index.html
          git diff --cached --quiet || (git commit -m "Build V81 single-file demo" && git push)
