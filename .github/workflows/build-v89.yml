name: Build V89 welcome and cookie controls
on:
  push:
    paths:
      - 'source/v89/**'
      - 'tools/rebuild_v89.py'
      - 'tests/v89-overlays.py'
      - '.github/workflows/build-v89.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: wjo-v89-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install website and browser test dependencies
        run: |
          python -m pip install pillow playwright
          python -m playwright install chromium
      - name: Validate V89 source
        run: |
          node --check source/v89/overlays.js
          python -m py_compile tools/rebuild_v89.py tests/v89-overlays.py
      - name: Build complete V89 HTML and ZIP
        run: python tools/rebuild_v89.py
      - name: Test welcome and cookie controls in mobile and desktop browsers
        run: python tests/v89-overlays.py
      - name: Verify download contents and previous features
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          content=Path('WJO_V89_SINGLE_FILE_DEMO.html').read_text(encoding='utf-8')
          for s in ['wjo-v89-overlay-css','w89-cookie-control','w89-welcome-dialog',
                    'wjo-v88-instructors-css','wjo-v87-experience-css',
                    'WJO_V85_CHART_IMAGES','WJO_V84_GRADES','WJO_FULL_NEWS_ARCHIVE',
                    "routes['committee-hub']"]:
              assert s in content,s
          assert content.count("window.addEventListener('hashchange',render);render()")==1
          with ZipFile('WJO_V89_DOWNLOAD.zip') as z:
              assert 'WJO_V89_SINGLE_FILE_DEMO.html' in z.namelist()
              assert len([x for x in z.namelist() if 'Brown_2nd_Tag' in x])==2
          for device in ('mobile','desktop'):
              assert (Path('assets/previews')/('wjo-v89-welcome-'+device+'.jpg')).exists()
              assert (Path('assets/previews')/('wjo-v89-cookie-'+device+'.jpg')).exists()
          print('V89 complete: welcome modal, persistent cookie control and previous pages retained')
          PY
      - name: Publish verified V89 demo and preview screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f WJO_V89_SINGLE_FILE_DEMO.html WJO_V89_DOWNLOAD.zip dist/index.html assets/previews/wjo-v89-*.jpg
          if ! git diff --cached --quiet; then
            git commit -m "Publish V89 with restored welcome popup and persistent cookie settings"
            # Earlier builders update intermediate demo files; avoid rebasing
            # those uncommitted outputs over unrelated concurrent repo changes.
            git reset --hard HEAD
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push; then
                exit 0
              fi
            done
            echo "V89 download publication failed after retries" >&2
            exit 1
          fi
