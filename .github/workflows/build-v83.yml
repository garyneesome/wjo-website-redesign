name: Build V83 website demo
on:
  push:
    paths:
      - 'source/v83/**'
      - 'tools/rebuild_v83.py'
      - '.github/workflows/build-v83.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pillow
      - name: Build all previous versions and V83
        run: python tools/rebuild_v83.py
      - name: Validate V83 single-file demo
        run: |
          python - <<'PY'
          from pathlib import Path
          html=Path('WJO_V83_SINGLE_FILE_DEMO.html').read_text()
          for key in ('WJO_FULL_NEWS_ARCHIVE','WJO_V81_FAMILY_PHOTOS','v83-first-grid','routes.instructors'):
              assert key in html,key
          assert len(html)>100000
          assert Path('WJO_V83_DOWNLOAD.zip').stat().st_size>10000
          print('V83 verified bytes:',len(html))
          PY
      - name: Publish single-file HTML and ZIP
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f WJO_V83_SINGLE_FILE_DEMO.html WJO_V83_DOWNLOAD.zip dist/index.html
          git diff --cached --quiet || (git commit -m "Build V83 single-file website demo" && git push)