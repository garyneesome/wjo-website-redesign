<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WJO • V71 GitHub preview</title>
<style>
html,body{margin:0;min-height:100%;background:#08090b;color:#f5f1eb;font-family:Arial,Helvetica,sans-serif}
#loading{min-height:100vh;display:grid;place-items:center;text-align:center;padding:32px;box-sizing:border-box}
.card{max-width:620px;border:1px solid #333b45;border-radius:24px;padding:32px;background:#12151a}
h1{margin:0 0 12px;font-size:clamp(28px,7vw,48px)}
p{color:#b7bec8;line-height:1.6}
</style>
</head>
<body>
<div id="loading"><div class="card"><h1>Loading the latest WJO V71 preview…</h1><p>The interactive mockup is being assembled from the V66 baseline with the approved Brackley photographs, family journey guide and V71 responsive refinements.</p></div></div>
<script>
(async()=>{
  // This entry works on third-party HTML preview pages without GitHub Pages.
  const V71_REPO_ROOT='https://raw.githubusercontent.com/garyneesome/wjo-website-redesign/main/';
  try{
    const [manifest,patch,patch68,patch69,patch70,patch71]=await Promise.all([
      fetch(V71_REPO_ROOT+"source/v66/manifest.json",{cache:"no-store"}).then(r=>{if(!r.ok)throw new Error("V66 manifest");return r.json()}),
      fetch(V71_REPO_ROOT+"source/v67/patch.json",{cache:"no-store"}).then(r=>{if(!r.ok)throw new Error("V67 patch");return r.json()}),
      fetch(V71_REPO_ROOT+"source/v68/patch.json",{cache:"no-store"}).then(r=>{if(!r.ok)throw new Error("V68 patch");return r.json()}),
      fetch(V71_REPO_ROOT+"source/v69/patch.json",{cache:"no-store"}).then(r=>{if(!r.ok)throw new Error("V69 patch");return r.json()}),
      fetch(V71_REPO_ROOT+"source/v70/patch.json",{cache:"no-store"}).then(r=>{if(!r.ok)throw new Error("V70 patch");return r.json()}),
      fetch(V71_REPO_ROOT+"source/v71/patch.json",{cache:"no-store"}).then(r=>{if(!r.ok)throw new Error("V71 patch");return r.json()})
    ]);
    const chunks=await Promise.all(manifest.parts.map(p=>fetch(V71_REPO_ROOT+p,{cache:"no-store"}).then(r=>{if(!r.ok)throw new Error(p);return r.text()})));
    let html=chunks.join("");
    for(const op of [...patch.replacements,...patch68.replacements,...patch69.replacements,...patch70.replacements,...patch71.replacements]){
      const hits=html.split(op.find).length-1;
      if(hits<(op.count||1))throw new Error("Patch target missing");
      for(let i=0;i<(op.count||1);i++)html=html.replace(op.find,op.replace);
    }
    document.open();
    document.write(html);
    document.close();
  }catch(err){
    document.getElementById("loading").innerHTML='<div class="card"><h1>V71 source is ready</h1><p>This loader needs to be served over HTTP. Use GitHub Pages, run <strong>python -m http.server</strong> in the repository, or run <strong>python tools/rebuild_v71.py</strong> to recreate the self-contained V71 HTML file.</p></div>';
    console.error(err);
  }
})();
</script>
</body>
</html>
